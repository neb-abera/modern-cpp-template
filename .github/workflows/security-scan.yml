name: Security scan

# Known-CVE search inside the toolchain container image (trivy) — the one
# vulnerability class static analysis of the sources cannot see. The weekly
# schedule matters as much as the PR run: new CVEs are published against
# images that have not changed.
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "15 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-scan:
    name: container scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build toolchain image
        run: docker build -t scan-target .

      - name: scan for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: scan-target
          severity: HIGH,CRITICAL
          # Distro packages with no fixed version yet are Ubuntu's queue, not
          # this PR's; the weekly scheduled run picks them up once fixed.
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          # SARIF output ignores the severity filter unless this is set,
          # which makes exit-code fire on LOW/MEDIUM noise.
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: upload findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy.sarif
