name: CI

on:
  # Unfiltered pull_request: filtering on the default branch leaves a PR
  # stacked on another feature branch with no checks at all.
  pull_request:
  push:
    branches: [ main, master ]

# Least-privilege token: read-only for all CI jobs.
permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: harden runner (Linux)
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The default GCC on the ubuntu-latest runner (24.04) is 13, which
    # predates C++26; GCC 14+ supports it.
    - name: select GCC 14 (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update && sudo apt-get install -y g++-14
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: configure
      run: cmake --preset release -DProject_WARNINGS_AS_ERRORS=ON

    - name: build
      run: cmake --build --preset release -j 4

    - name: run tests
      run: ctest --preset release

    - name: install project
      run: cmake --install build/release --prefix "${{ github.workspace }}/.local" --config Release

  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest

    steps:
    - name: harden runner (Linux)
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: select GCC 14
      run: |
        sudo apt-get update && sudo apt-get install -y g++-14
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: configure
      run: cmake --preset asan -DProject_WARNINGS_AS_ERRORS=ON

    - name: build
      run: cmake --build --preset asan -j 4

    - name: run tests
      run: ctest --preset asan

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
    - name: harden runner (Linux)
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: select GCC 14
      run: |
        sudo apt-get update && sudo apt-get install -y g++-14
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: configure
      run: cmake --preset coverage

    - name: build
      run: cmake --build --preset coverage -j 4

    - name: run tests
      run: ctest --preset coverage

    - name: generate coverage data
      run: find build/coverage -type f -name '*.gcno' -exec gcov-14 -pb {} +

    - name: upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
    - name: harden runner (Linux)
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: check formatting
      run: |
        shopt -s nullglob globstar
        clang-format --dry-run --Werror src/**/*.cpp include/**/*.hpp test/**/*.cpp

  # Flags known-vulnerable dependencies introduced by a PR, from the diff of
  # the dependency graph (actions and docker ecosystems here).
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high

  # ThreadSanitizer: the "C++ Concurrency in Action" material as a gate.
  tsan:
    name: thread sanitizer (TSan)
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: select GCC 14
      run: |
        sudo apt-get update && sudo apt-get install -y g++-14
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: configure
      run: cmake --preset tsan -DProject_WARNINGS_AS_ERRORS=ON

    - name: build
      run: cmake --build --preset tsan -j 4

    - name: run tests
      run: ctest --preset tsan

  # clang-tidy: the C++ Core Guidelines and SEI CERT checks as a gate. Runs
  # in the project toolchain image so the clang-tidy version matches local
  # verification.
  static-analysis:
    name: static analysis (clang-tidy)
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: build toolchain image
      run: docker build -t toolchain .

    - name: run clang-tidy via the tidy preset
      run: |
        docker run --rm -v "$PWD":/src:ro toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          cmake --preset tidy
          cmake --build --preset tidy -j 4
        '
