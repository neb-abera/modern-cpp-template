name: CI

on:
  # Unfiltered pull_request: filtering on the default branch leaves a PR
  # stacked on another feature branch with no checks at all.
  pull_request:
  push:
    branches: [ main, master ]

# Least-privilege token: read-only for all CI jobs.
permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (toolchain container)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        # Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # BuildKit's GitHub Actions layer cache keeps the per-job image build
    # cheap: only the first run after a Dockerfile change pays the full
    # build, every other job and run gets the layers from cache in seconds.
    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: build toolchain image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: toolchain
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Source mounted read-only and copied inside, as in verify-docker.sh, so
    # the checkout is never modified by the container.
    - name: build, test and install in the container
      run: |
        docker run --rm -v "$PWD":/src:ro toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          cmake --preset release -DProject_WARNINGS_AS_ERRORS=ON
          cmake --build --preset release -j 4
          ctest --preset release
          cmake --install build/release --prefix "$HOME/.local" --config Release
        '

  # Portability gate: macOS and Windows cannot run the Linux toolchain
  # container, so these legs build with the runners' native toolchains
  # (AppleClang, MSVC), warnings as errors — making the suite's
  # warnings-as-errors claim hold on all three compilers. fail-fast off so
  # one red leg never hides the other's result.
  portability:
    name: portability smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: configure
      run: cmake --preset release -DProject_WARNINGS_AS_ERRORS=ON

    - name: build
      run: cmake --build --preset release -j 4

    - name: run tests
      run: ctest --preset release

    - name: install project
      run: cmake --install build/release --prefix "${{ github.workspace }}/.local" --config Release

  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        # Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: build toolchain image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: toolchain
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: run tests under ASan + UBSan in the container
      run: |
        docker run --rm -v "$PWD":/src:ro toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          cmake --preset asan -DProject_WARNINGS_AS_ERRORS=ON
          cmake --build --preset asan -j 4
          ctest --preset asan
        '

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        # Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: build toolchain image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: toolchain
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # gcov must match the compiler that produced the .gcno files; inside the
    # container that is simply the image's own gcov, single-sourced from the
    # Dockerfile. The .gcov files are written to a world-writable host mount
    # (the source itself stays read-only), with the container-local prefix
    # stripped so Codecov maps them to repository paths.
    #
    # gcovr enforces the line-coverage floor inside this required check:
    # the Codecov statuses (codecov.yaml) are separate, non-required
    # contexts, so without --fail-under-line this job would stay green at
    # any coverage level. 90 leaves headroom under the template's own 100%
    # (src/ + include/, tests excluded — the same scope codecov.yaml
    # measures).
    - name: build, test and generate coverage in the container
      run: |
        mkdir -p coverage-out && chmod 777 coverage-out
        docker run --rm -v "$PWD":/src:ro -v "$PWD/coverage-out":/out toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          cmake --preset coverage -DProject_WARNINGS_AS_ERRORS=ON
          cmake --build --preset coverage -j 4
          ctest --preset coverage
          gcovr -r . --filter "src/" --filter "include/" \
            --print-summary --fail-under-line 90 build/coverage
          find build/coverage -type f -name "*.gcno" -exec gcov -pb {} +
          sed -i "s|$HOME/project/||g" ./*.gcov
          cp ./*.gcov /out/
        '

    - name: upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: harden runner (Linux)
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          uploads.github.com:443
          auth.docker.io:443
          registry-1.docker.io:443
          production.cloudflare.docker.com:443
          index.docker.io:443
          archive.ubuntu.com:80
          archive.ubuntu.com:443
          security.ubuntu.com:80
          security.ubuntu.com:443
          pypi.org:443
          files.pythonhosted.org:443
          ghcr.io:443
          pkg-containers.githubusercontent.com:443
          cli.codecov.io:443
          api.codecov.io:443
          ingest.codecov.io:443
          storage.googleapis.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: check formatting
      run: |
        shopt -s nullglob globstar
        clang-format --dry-run --Werror src/**/*.cpp include/**/*.hpp test/**/*.cpp fuzz/**/*.cpp bench/**/*.cpp

  # Lint the linters: actionlint keeps the workflow files themselves honest
  # (expression typos, wrong action inputs, shellcheck on run: blocks) and
  # shellcheck covers the repository's scripts. The actionlint binary is
  # pinned by version and SHA-256, matching the SHA-pinning discipline used
  # for actions.
  lint:
    name: lint workflows and scripts (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install actionlint (pinned, checksum-verified)
      run: |
        set -euo pipefail
        version=1.7.12
        sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        curl -fsSL -o actionlint.tar.gz \
          "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
        echo "${sha256}  actionlint.tar.gz" | sha256sum -c -
        tar -xzf actionlint.tar.gz actionlint
        rm actionlint.tar.gz

    - name: actionlint over the workflows
      run: ./actionlint -color

    - name: shellcheck over the scripts
      run: shellcheck scripts/*.sh

  # Flags known-vulnerable dependencies introduced by a PR, from the diff of
  # the dependency graph (actions and docker ecosystems here).
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          uploads.github.com:443
          api.deps.dev:443
          api.securityscorecards.dev:443
          auth.docker.io:443
          registry-1.docker.io:443
          production.cloudflare.docker.com:443
          index.docker.io:443
          archive.ubuntu.com:80
          archive.ubuntu.com:443
          security.ubuntu.com:80
          security.ubuntu.com:443
          pypi.org:443
          files.pythonhosted.org:443
          ghcr.io:443
          pkg-containers.githubusercontent.com:443
          cli.codecov.io:443
          api.codecov.io:443
          ingest.codecov.io:443
          storage.googleapis.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high

  # ThreadSanitizer: the "C++ Concurrency in Action" material as a gate.
  tsan:
    name: thread sanitizer (TSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        # Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: build toolchain image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: toolchain
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: run tests under TSan in the container
      run: |
        docker run --rm -v "$PWD":/src:ro toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          cmake --preset tsan -DProject_WARNINGS_AS_ERRORS=ON
          cmake --build --preset tsan -j 4
          ctest --preset tsan
        '

  # clang-tidy: the C++ Core Guidelines and SEI CERT checks as a gate. Runs
  # in the project toolchain image so the clang-tidy version matches local
  # verification.
  static-analysis:
    name: static analysis (clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        # Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: build toolchain image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: toolchain
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: run clang-tidy via the tidy preset
      run: |
        docker run --rm -v "$PWD":/src:ro toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          cmake --preset tidy -DProject_WARNINGS_AS_ERRORS=ON
          cmake --build --preset tidy -j 4
        '

  # libFuzzer smoke: the fuzz harness builds and survives a short
  # coverage-guided run. Real fuzzing campaigns run longer or continuously
  # (see the fuzz directory); this gate keeps the harness from rotting.
  fuzz:
    name: fuzz smoke (libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        # Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: build toolchain image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: toolchain
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Seeded from the committed regression corpus (fuzz/corpus/<target>/):
    # the seeds cover the parse paths and every previously fixed crash, so
    # the short smoke starts from known-interesting inputs instead of
    # rediscovering them. New inputs the run finds go to a container-local
    # scratch dir (first corpus argument) and are discarded; crash inputs
    # land on the host mount via -artifact_prefix so they survive the run.
    - name: build and smoke-run the fuzz target
      run: |
        mkdir -p fuzz-findings && chmod 777 fuzz-findings
        docker run --rm -v "$PWD":/src:ro -v "$PWD/fuzz-findings":/findings toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          cmake --preset fuzz
          cmake --build --preset fuzz -j 4
          mkdir -p build/fuzz/corpus
          ./build/fuzz/fuzz/tmp_fuzz -max_total_time=15 -artifact_prefix=/findings/ \
            build/fuzz/corpus fuzz/corpus/tmp_fuzz
        '

    # Without this upload a CI-discovered crash dies with the runner and
    # cannot be reproduced or committed to the corpus. Retrieve the input
    # from the artifact, fix the bug, and commit the input to
    # fuzz/corpus/<target>/ so the fix can never regress silently.
    - name: retain crash inputs
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-crash-artifacts
        path: fuzz-findings/
        if-no-files-found: ignore
        retention-days: 30

  # Benchmarks are a harness, not a timing gate: shared runners make numbers
  # noise, so CI only proves the harness builds and completes a run.
  bench:
    name: bench smoke (Google Benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        # Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: build toolchain image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: toolchain
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: build and smoke-run the benchmarks in the container
      run: |
        docker run --rm -v "$PWD":/src:ro toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          cmake --preset bench
          cmake --build --preset bench -j 4
          ./build/bench/bench/tmp_bench --benchmark_min_time=0.01s
        '

  # The verify.sh checks no dedicated job above covers: strict standard mode,
  # executable-mode smoke, install-tree purity, the mutation canary and the
  # required-contexts drift guard. Runs the same script CI's other jobs
  # mirror, restricted to those checks via VERIFY_CHECKS (release is included
  # because the strict/install/canary checks read its build tree). This is
  # what makes the README's "CI gates on the identical suite" claim true.
  verify-extras:
    name: verify extras (canary, purity, strict, exe, drift)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        # Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: build toolchain image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: toolchain
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: run the remaining verify.sh checks in the container
      run: |
        docker run --rm -v "$PWD":/src:ro toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          VERIFY_CHECKS="release strict exe install canary contexts" ./scripts/verify.sh
        '
