name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v5

    - name: configure
      run: cmake --preset release

    - name: build
      run: cmake --build --preset release -j 4

    - name: run tests
      run: ctest --preset release

    - name: install project
      run: cmake --install build/release --prefix "${{ github.workspace }}/.local" --config Release

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: configure
      run: cmake --preset coverage

    - name: build
      run: cmake --build --preset coverage -j 4

    - name: run tests
      run: ctest --preset coverage

    - name: generate coverage data
      run: find build/coverage -type f -name '*.gcno' -exec gcov -pb {} +

    - name: upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
