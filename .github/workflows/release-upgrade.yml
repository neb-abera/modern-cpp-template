# Opens a PR moving the Dockerfile's release-file pins (ENV <NAME>_VERSION
# and ENV <NAME>_SHA256 for LLVM, CMake, CBMC, ccache and Doxygen) to the
# newest releases. Dependabot cannot see a file a RUN line downloads, so
# scripts/check-newest-releases.sh closes that gap: the lint job fails once a
# newer release has been out 30 days, and this workflow opens the fix before
# then.
#
# Runs weekly and does nothing when the pin is current. Scheduled-only:
# this produces no PR-gating context, so it is deliberately outside
# .github/required-checks and the drift guard's scope. PRs opened with
# the default workflow token do not trigger CI. Close and reopen the PR
# (or push an empty commit) to run the checks.
name: release-upgrade

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

# Nothing at the workflow level: the write grants live on the one job that
# needs them (Scorecard Token-Permissions).
permissions: {}

jobs:
  upgrade:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # github.com: checkout; api.github.com: the release query and
          # create-pull-request's API-signed commits and PR call.
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: move the release-file pins to the newest releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: SUMMARY_FILE="$RUNNER_TEMP/release-summary.md" scripts/check-newest-releases.sh --update

      - name: open the upgrade PR
        if: steps.check.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/release-upgrade
          delete-branch: true
          # Commit via GitHub's API so the commit is signed by GitHub itself;
          # branches requiring Verified commits reject CLI-made bot commits.
          sign-commits: true
          commit-message: "Update the release-file pins to the newest releases"
          title: "Update the release-file pins to the newest releases"
          body-path: ${{ runner.temp }}/release-summary.md
