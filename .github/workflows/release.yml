name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege token: jobs are read-only except the release job below.
permissions:
  contents: read

env:
  PROJECT_NAME: "modern-cpp-template"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: select GCC 14 (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update && sudo apt-get install -y g++-14
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: configure
      run: cmake --preset release

    - name: build
      run: cmake --build --preset release -j 4

    - name: run tests
      run: ctest --preset release

    - name: stage install tree
      run: cmake --install build/release --prefix staging --config Release

    # github.ref_name is passed through env rather than interpolated into the
    # script: tag names may contain shell metacharacters.
    - name: package (Windows)
      if: runner.os == 'Windows'
      env:
        TAG: ${{ github.ref_name }}
      run: Compress-Archive -Path staging/* -DestinationPath "${{ env.PROJECT_NAME }}-${{ runner.os }}-$env:TAG.zip"

    - name: package
      if: runner.os != 'Windows'
      env:
        TAG: ${{ github.ref_name }}
      run: tar -czf "${{ env.PROJECT_NAME }}-${{ runner.os }}-${TAG}.tar.gz" -C staging .

    - name: upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ runner.os }}-${{ github.ref_name }}
        path: ${{ env.PROJECT_NAME }}-*

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        merge-multiple: true

    - name: create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" artifacts/* \
          --repo "${{ github.repository }}" \
          --title "Release $TAG" \
          --generate-notes
