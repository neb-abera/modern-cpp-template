name: Release

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_NAME: "modern-cpp-template"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: select GCC 14 (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update && sudo apt-get install -y g++-14
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: configure
      run: cmake --preset release

    - name: build
      run: cmake --build --preset release -j 4

    - name: run tests
      run: ctest --preset release

    - name: stage install tree
      run: cmake --install build/release --prefix staging --config Release

    - name: package (Windows)
      if: runner.os == 'Windows'
      run: Compress-Archive -Path staging/* -DestinationPath "${{ env.PROJECT_NAME }}-${{ runner.os }}-${{ github.ref_name }}.zip"

    - name: package
      if: runner.os != 'Windows'
      run: tar -czf "${{ env.PROJECT_NAME }}-${{ runner.os }}-${{ github.ref_name }}.tar.gz" -C staging .

    - name: upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ runner.os }}-${{ github.ref_name }}
        path: ${{ env.PROJECT_NAME }}-*

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" artifacts/* \
          --repo "${{ github.repository }}" \
          --title "Release ${{ github.ref_name }}" \
          --generate-notes
