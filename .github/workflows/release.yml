name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege token: jobs are read-only except the release job below.
permissions:
  contents: read

env:
  PROJECT_NAME: ${{ github.event.repository.name }}

# One release at a time, never cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: harden runner (Linux)
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
# Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The Linux release artifact is built inside the project's own toolchain
    # image, the same one development and CI gating use ("train as you
    # fight") — never a hand-picked compiler on the bare runner. The macOS
    # and Windows artifacts can only be built with those platforms' native
    # toolchains, so those legs stay on the host.
    - name: set up Docker Buildx (Linux)
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    # Same GHA layer cache as the CI workflow, so a release does not pay for
    # a full image rebuild unless the Dockerfile changed since the last run.
    - name: build toolchain image (Linux)
      if: runner.os == 'Linux'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: toolchain
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The install tree is staged onto a world-writable host mount; the
    # source itself stays read-only, as in verify-docker.sh.
    - name: build, test and stage in the container (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p staging && chmod 777 staging
        docker run --rm -v "$PWD":/src:ro -v "$PWD/staging":/out toolchain bash -c '
          set -e
          cp -r /src "$HOME/project" && cd "$HOME/project"
          cmake --preset release -DProject_WARNINGS_AS_ERRORS=ON
          cmake --build --preset release -j 4
          ctest --preset release
          cmake --install build/release --prefix /out --config Release
        '

    - name: configure
      if: runner.os != 'Linux'
      run: cmake --preset release -DProject_WARNINGS_AS_ERRORS=ON

    - name: build
      if: runner.os != 'Linux'
      run: cmake --build --preset release -j 4

    - name: run tests
      if: runner.os != 'Linux'
      run: ctest --preset release

    - name: stage install tree
      if: runner.os != 'Linux'
      run: cmake --install build/release --prefix staging --config Release

    # github.ref_name is passed through env rather than interpolated into the
    # script: tag names may contain shell metacharacters.
    - name: package (Windows)
      if: runner.os == 'Windows'
      env:
        TAG: ${{ github.ref_name }}
      run: Compress-Archive -Path staging/* -DestinationPath "${{ env.PROJECT_NAME }}-${{ runner.os }}-$env:TAG.zip"

    - name: package
      if: runner.os != 'Windows'
      env:
        TAG: ${{ github.ref_name }}
      run: tar -czf "${{ env.PROJECT_NAME }}-${{ runner.os }}-${TAG}.tar.gz" -C staging .

    - name: upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ runner.os }}-${{ github.ref_name }}
        path: ${{ env.PROJECT_NAME }}-*

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
# Audit, not block: this job builds/runs containers, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    # Only the packaged install trees: docker/build-push-action auto-uploads
    # a *.dockerbuild build-record artifact that must not reach the release,
    # the SBOMs or the attestation.
    - name: download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        merge-multiple: true
        pattern: "*-${{ github.ref_name }}"

    # SLSA build provenance for the packaged install trees; consumers verify
    # with 'gh attestation verify <file> --repo <owner>/<repo>'.
    # SPDX SBOM per artifact: what exactly is inside each shipped archive.
    - name: install syft
      uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

    # Extract each archive first and scan the directory: syft cannot unpack
    # Windows Compress-Archive zips itself (their directory entries carry no
    # permission bits, so its extraction mkdir fails).
    - name: generate SBOMs
      run: |
        set -euo pipefail
        for f in artifacts/*; do
          case "$f" in *.spdx.json) continue;; esac
          d=$(mktemp -d)
          case "$f" in
            *.zip) unzip -q "$f" -d "$d" ;;
            *.tar.gz) tar -xzf "$f" -C "$d" ;;
            *) echo "unknown artifact type: $f" >&2; exit 1 ;;
          esac
          syft scan "dir:$d" --source-name "$(basename "$f")" -o spdx-json > "$f.spdx.json"
          rm -rf "$d"
        done
        ls -la artifacts/

    - name: attest artifact provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: artifacts/*

    - name: create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" artifacts/* \
          --repo "${{ github.repository }}" \
          --title "Release $TAG" \
          --generate-notes
