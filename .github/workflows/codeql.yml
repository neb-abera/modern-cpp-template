name: CodeQL

on:
  # Unfiltered pull_request: filtering on the default branch leaves a PR
  # stacked on another feature branch with no checks at all.
  pull_request:
  # A merge queue tests the queued merge of this PR with the base branch;
  # the required checks must report on that event or the queue waits forever.
  merge_group:
  push:
    branches: [ main, master ]
  schedule:
    # Weekly scan so new queries run even without commits
    - cron: '30 6 * * 1'

permissions:
  contents: read

# Outside a pull request each commit gets its own group. A group holds one
# running and one pending run, and a third run cancels the pending one
# whatever cancel-in-progress says. Keyed by branch, that left aberaTech
# 2d7cced and aab70ed with no checks on 2026-09-26. On a pull request a
# newer push still cancels the older run. scripts/check-concurrency.sh
# enforces this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The C++ leg runs on the ubuntu-26.04 runner image, the toolchain
          # container's distro, with the container's GCC copied in from the
          # same pinned image, so CodeQL observes the build CI gates on.
          # CodeQL traces the build on the bare runner: its build tracer
          # cannot follow a docker-run build.
          - language: c-cpp
            build-mode: manual
            runner: ubuntu-26.04
          - language: actions
            build-mode: none
            runner: ubuntu-latest

    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          uploads.github.com:443
          auth.docker.io:443
          registry-1.docker.io:443
          production.cloudflare.docker.com:443
          index.docker.io:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # C++ needs a real build for CodeQL to observe, with the compiler the
    # toolchain container gates with. The runner's g++ is Ubuntu's GCC 15,
    # so GCC is copied out of the Dockerfile's gcc stage, the same
    # digest-pinned image, before CodeQL starts tracing. The version check
    # makes a mismatch fail here rather than drift the analyzed build.
    - name: use the toolchain container's GCC
      if: matrix.language == 'c-cpp'
      run: |
        image="$(sed -nE 's/^FROM (gcc:[^[:space:]]+) AS gcc$/\1/p' Dockerfile)"
        if [ -z "$image" ]; then echo "no 'FROM gcc:<tag>@<digest> AS gcc' line in Dockerfile"; exit 1; fi
        want="${image#gcc:}"
        want="${want%%@*}"
        sudo mkdir -p /opt/gcc
        docker run --rm -v /opt/gcc:/out "$image" cp -a /usr/local/. /out/
        /opt/gcc/bin/g++ --version
        if [ "$(/opt/gcc/bin/g++ -dumpfullversion)" != "$want" ]; then echo "expected GCC $want"; exit 1; fi
        {
          echo "CC=/opt/gcc/bin/gcc"
          echo "CXX=/opt/gcc/bin/g++"
          echo "LD_LIBRARY_PATH=/opt/gcc/lib64"
        } >> "$GITHUB_ENV"

    - name: initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: build
      if: matrix.language == 'c-cpp'
      run: |
        cmake --preset release -DProject_WARNINGS_AS_ERRORS=ON
        cmake --build --preset release -j 4

    - name: perform CodeQL analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        category: "/language:${{ matrix.language }}"
