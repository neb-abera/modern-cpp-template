name: CodeQL

on:
  # Unfiltered pull_request: filtering on the default branch leaves a PR
  # stacked on another feature branch with no checks at all.
  pull_request:
  # A merge queue tests the queued merge of this PR with the base branch;
  # the required checks must report on that event or the queue waits forever.
  merge_group:
  push:
    branches: [ main, master ]
  schedule:
    # Weekly scan so new queries run even without commits
    - cron: '30 6 * * 1'

permissions:
  contents: read

# Outside a pull request each commit gets its own group. A group holds one
# running and one pending run, and a third run cancels the pending one
# whatever cancel-in-progress says. Keyed by branch, that left aberaTech
# 2d7cced and aab70ed with no checks on 2026-09-26. On a pull request a
# newer push still cancels the older run. scripts/check-concurrency.sh
# enforces this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The C++ leg runs on the ubuntu-26.04 runner image: same distro
          # and default GCC major (15) as the toolchain container, so CodeQL
          # observes the build CI actually gates on. Residual deviation from
          # "train as you fight": CodeQL traces the build on the bare runner,
          # not inside the container — its build tracer cannot follow a
          # docker-run build without disproportionate contortions, and distro
          # + compiler major + the same preset flags close most of the gap.
          - language: c-cpp
            build-mode: manual
            runner: ubuntu-26.04
          - language: actions
            build-mode: none
            runner: ubuntu-latest

    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          uploads.github.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # C++ needs a real build for CodeQL to observe. The runner's default
    # g++ is GCC 15, the same major the toolchain container gates with; the
    # assertion makes a runner-image compiler change fail loudly here rather
    # than silently drift the analyzed build away from the gated one.
    - name: assert GCC 15 (same major as the toolchain container)
      if: matrix.language == 'c-cpp'
      run: |
        g++ --version
        g++ -dumpversion | grep -qx '15' || { echo "expected GCC major 15"; exit 1; }

    - name: build
      if: matrix.language == 'c-cpp'
      run: |
        cmake --preset release -DProject_WARNINGS_AS_ERRORS=ON
        cmake --build --preset release -j 4

    - name: perform CodeQL analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        category: "/language:${{ matrix.language }}"
