name: CodeQL

on:
  # Unfiltered pull_request: filtering on the default branch leaves a PR
  # stacked on another feature branch with no checks at all.
  pull_request:
  push:
    branches: [ main, master ]
  schedule:
    # Weekly scan so new queries run even without commits
    - cron: '30 6 * * 1'

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The C++ leg runs on the ubuntu-26.04 runner image: same distro
          # and default GCC major (15) as the toolchain container, so CodeQL
          # observes the build CI actually gates on. Residual deviation from
          # "train as you fight": CodeQL traces the build on the bare runner,
          # not inside the container — its build tracer cannot follow a
          # docker-run build without disproportionate contortions, and distro
          # + compiler major + the same preset flags close most of the gap.
          - language: c-cpp
            build-mode: manual
            runner: ubuntu-26.04
          - language: actions
            build-mode: none
            runner: ubuntu-latest

    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          uploads.github.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # C++ needs a real build for CodeQL to observe. The runner's default
    # g++ is GCC 15, the same major the toolchain container gates with; the
    # assertion makes a runner-image compiler change fail loudly here rather
    # than silently drift the analyzed build away from the gated one.
    - name: assert GCC 15 (same major as the toolchain container)
      if: matrix.language == 'c-cpp'
      run: |
        g++ --version
        g++ -dumpversion | grep -qx '15' || { echo "expected GCC major 15"; exit 1; }

    - name: build
      if: matrix.language == 'c-cpp'
      run: |
        cmake --preset release -DProject_WARNINGS_AS_ERRORS=ON
        cmake --build --preset release -j 4

    - name: perform CodeQL analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        category: "/language:${{ matrix.language }}"
