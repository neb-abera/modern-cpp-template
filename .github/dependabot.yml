# Keeps the SHA-pinned GitHub Actions and the Docker base image current.
# Dependabot PRs update the pinned SHA and the version comment together, so
# supply-chain pinning and staying on the latest versions are compatible.
#
# Minor and patch updates arrive grouped — one PR per ecosystem per week — and
# the dependabot-automerge workflow arms auto-merge on every Dependabot PR,
# majors included: red CI, not update size, is the review signal. A bump that
# passes the gates merges itself; one that genuinely breaks stays open and
# red for a human.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait out the first days after a release, when hijacked-package and
    # broken-release discoveries usually happen, before taking an update.
    cooldown:
      default-days: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait out the first days after a release, when hijacked-package and
    # broken-release discoveries usually happen, before taking an update.
    cooldown:
      default-days: 5
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # Ubuntu LTS only. An LTS is YY.04 with an even YY. The rest are interim
    # releases with 9 months of support, and auto-merge would take them.
    # One range per gap between two LTS releases. Dependabot reads docker
    # ranges in Bundler syntax against the tag, so 28.04 and the digest of
    # the current tag are still offered. scripts/check-ubuntu-lts.sh fails
    # once the ranges stop covering the next two years: add the next
    # ">= YY.05, < YY.04" line then.
    ignore:
      - dependency-name: ubuntu
        versions:
          - ">= 26.05, < 28.04"
          - ">= 28.05, < 30.04"
          - ">= 30.05, < 32.04"
