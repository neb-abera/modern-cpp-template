ignore:
  - "test"

# Codecov-side status checks. These are not required branch-protection
# contexts, so a miss here shows red on the PR without blocking the merge.
# The blocking floor lives in the required "coverage" CI job itself, which
# fails below 90% line coverage via gcovr --fail-under-line — these Codecov
# targets mirror that floor and add the trend/patch signal on top. The
# template's own coverage is 100%; thresholds leave room for real projects
# generated from it.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 2%
    patch:
      default:
        target: 75%
        # Informational: tiny diffs make patch coverage noisy.
        informational: true

comment:
  require_changes: true
